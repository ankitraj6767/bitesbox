name: Automatic Android release

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'scripts/publish_android_release.sh'
      - '.github/workflows/android-auto-release.yml'
  workflow_dispatch:
    inputs:
      notes:
        description: Release notes shown in the app update prompt
        required: false
        type: string
        default: Automatic Bites Box update
      mandatory:
        description: Force users to install this update
        required: false
        type: boolean
        default: false

concurrency:
  group: bitesbox-android-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Build and publish Android update
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64:-}" ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is required. Android rejects updates signed with another key."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > apps/mobile/android/update-keystore.jks
          cat > apps/mobile/android/key.properties <<PROPERTIES
          storeFile=update-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          PROPERTIES

      - name: Install dependencies and verify
        working-directory: apps/mobile
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Resolve automatic version
        id: version
        run: |
          set -euo pipefail
          base="$(grep -E '^version:' apps/mobile/pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d. -f1-2)"
          version="${base}.${GITHUB_RUN_NUMBER}"
          build="${GITHUB_RUN_NUMBER}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Auto release version: $version+$build"

      - name: Build split APKs
        working-directory: apps/mobile
        run: |
          flutter build apk --release --split-per-abi \
            --build-name="${{ steps.version.outputs.version }}" \
            --build-number="${{ steps.version.outputs.build }}" \
            --dart-define-from-file=env/hosted.json

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bitesbox-android-${{ steps.version.outputs.version }}
          retention-days: 14
          if-no-files-found: error
          path: apps/mobile/build/app/outputs/flutter-apk/app-*-release.apk

      - name: Publish APKs and update manifest
        env:
          SUPABASE_URL: https://kqsbzafxntsksalchlgc.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RELEASE_NOTES: ${{ inputs.notes || 'Automatic Bites Box update' }}
          RELEASE_MANDATORY: ${{ inputs.mandatory || false }}
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY is required to publish the update manifest."
            exit 1
          fi
          ./scripts/publish_android_release.sh \
            --version "${{ steps.version.outputs.version }}" \
            --build "${{ steps.version.outputs.build }}" \
            --notes "$RELEASE_NOTES" \
            --mandatory "$RELEASE_MANDATORY" \
            --arm64 apps/mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            --armv7 apps/mobile/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            --x64 apps/mobile/build/app/outputs/flutter-apk/app-x86_64-release.apk

      - name: Remove signing material
        if: always()
        run: |
          rm -f apps/mobile/android/key.properties apps/mobile/android/update-keystore.jks
